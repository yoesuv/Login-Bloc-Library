plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {

    println("app/build.gradle # min SDK : " + flutter.minSdkVersion)
    println("app/build.gradle # target SDK : " + flutter.targetSdkVersion)

    signingConfigs {
        keyConfig {
            keyAlias KEY_ALIAS
            keyPassword KEY_PASSWORD
            storeFile file('../my-app-key.keystore')
            storePassword STORE_PASSWORD
        }
    }

    namespace "com.yoesuv.login_bloc_library"
    compileSdkVersion flutter.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.yoesuv.login_bloc_library"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.keyConfig
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.keyConfig
            applicationVariants.all { variant ->
                variant.outputs.each { output ->
                    def appName = variant.applicationId
                    def abi = output.getFilter(com.android.build.OutputFile.ABI)
                    if (abi != null) {
                        output.outputFileName = "${appName}-${variant.name}-${abi}-v${variant.versionName}.apk"
                    } else {
                        output.outputFileName = "${appName}-${variant.name}-v${variant.versionName}.apk"
                    }
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies { }